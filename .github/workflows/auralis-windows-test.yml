name: Build Auralis Windows Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "auralis-toefl/**"
      - ".github/workflows/auralis-windows-test.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: auralis-toefl

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auralis-toefl/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: auralis-toefl/backend/requirements.txt

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows voice service
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --clean auralis-voice.spec
          if (-not (Test-Path "dist/auralis-voice/auralis-voice.exe")) { throw "Voice sidecar was not created" }

      - name: Build Windows installer
        run: npx tauri build --config src-tauri/tauri.windows.conf.json --bundles nsis

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Auralis-TOEFL-Windows-Test-0.6.2
          path: auralis-toefl/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish retrievable test EXE branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not found" }
          if ($installer.Length -ge 95MB) { throw "Installer is too large for the temporary artifact branch" }

          $publish = Join-Path $env:RUNNER_TEMP "auralis-windows-test"
          New-Item -ItemType Directory -Force -Path $publish | Out-Null
          $publishedExe = Join-Path $publish "Auralis-TOEFL-Windows-Test-0.6.2.exe"
          Copy-Item $installer.FullName $publishedExe
          $sha256 = (Get-FileHash $publishedExe -Algorithm SHA256).Hash.ToLowerInvariant()
          @{
            version = "0.6.2"
            source_commit = "${{ github.sha }}"
            sha256 = $sha256
            built_at = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json | Set-Content (Join-Path $publish "build-info.json") -Encoding utf8

          Set-Location $publish
          git init
          git checkout -b windows-test-artifact
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Auralis-TOEFL-Windows-Test-0.6.2.exe build-info.json
          git commit -m "Auralis Windows test 0.6.2"
          git remote add origin "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git"
          git push --force origin windows-test-artifact
