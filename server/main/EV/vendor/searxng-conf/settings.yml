# EV 本地 SearXNG：只给 AgentSearch 内部调用，不对外暴露。
# 关键两点：开 json 输出（默认只有 html，API 取不到数据）；关 limiter（否则非浏览器请求被挡）。
use_default_settings: true

general:
  instance_name: "EV Local Search"
  donation_url: false
  contact_url: false
  enable_metrics: false

server:
  bind_address: "127.0.0.1"
  port: 8088
  secret_key: "ev-local-searxng-please-change"
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json

outgoing:
  # SearXNG 不读 HTTP_PROXY 环境变量，必须显式配置；本机 Clash 在 7897。
  # 代理没开时国外引擎会超时，国内引擎（baidu/sogou/360）仍可直连兜底。
  proxies:
    all://:
      - http://127.0.0.1:7897
  request_timeout: 10.0
  max_request_timeout: 20.0
  pool_connections: 100
  pool_maxsize: 20
