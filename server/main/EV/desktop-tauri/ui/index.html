<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EV Surface</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="is-entering">
  <main class="surface-window" id="surface-window">
    <header class="surface-bar" id="surface-bar">
      <div class="surface-title" id="surface-title"></div>
      <span class="surface-status" id="surface-status" aria-label="已连接"></span>
      <button class="surface-close" id="surface-close" type="button" aria-label="关闭窗口">×</button>
    </header>
    <section class="surface-content" id="surface-content"></section>
  </main>
  <script type="module" src="surface.js"></script>
</body>
</html>
