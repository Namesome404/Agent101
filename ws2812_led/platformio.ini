[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
lib_deps =
  fastled/FastLED@^3.9.15
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2
build_flags =
  -DCORE_DEBUG_LEVEL=0

