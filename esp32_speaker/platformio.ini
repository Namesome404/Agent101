; Muse 网络扬声器 · ESP32 + MAX98357A(I2S)
; 作为语音 AI 的扬声器之一：连到 Muse(:8002) 的 /api/speaker/ws，收裸 PCM 播放。
; 接线：DIN→GPIO15  BCLK→GPIO2  LRC(WS)→GPIO4  SD→GPIO5  VIN→5V  GND→GND
[env]
platform = espressif32@^6.5.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    links2004/WebSockets @ ^2.4.2
    bblanchon/ArduinoJson @ ^7.1.0
    https://github.com/tzapu/WiFiManager.git#v2.0.17
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:esp32dev]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
